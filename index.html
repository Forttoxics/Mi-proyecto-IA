<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi IA</title>
<style>
  :root { --bg:#0c0e18; --panel:#161a2e; --txt:#eceef8; --dim:#8b91bb;
          --accent:#7c5cff; --accent2:#38bdf8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui, sans-serif; background:var(--bg); color:var(--txt);
         height:100dvh; display:flex; flex-direction:column; }
  /* ---------- HUD minimalista ---------- */
  #hud { display:flex; align-items:center; gap:12px; padding:12px 16px;
         background:rgba(16,19,35,.75); backdrop-filter:blur(12px);
         border-bottom:1px solid #232849; position:sticky; top:0; z-index:10; }
  #hud h1 { font-size:1rem; font-weight:700; letter-spacing:.5px; white-space:nowrap; }
  #hud h1 i { color:var(--accent); font-style:normal; }
  .chips { display:flex; gap:6px; overflow-x:auto; flex:1; min-width:0;
           scrollbar-width:none; scroll-snap-type:x proximity; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; background:transparent; border:1px solid #2a3055; color:var(--dim);
          padding:6px 12px; border-radius:999px; cursor:pointer; font-size:.82rem;
          transition:.18s; scroll-snap-align:start; white-space:nowrap; }
  .chip:hover { color:var(--txt); border-color:var(--accent2); }
  .chip.activa { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .ctrl { display:flex; align-items:center; gap:10px; white-space:nowrap; }
  .filtro { display:flex; align-items:center; gap:6px; font-size:.78rem; color:var(--dim); }
  input[type=range] { accent-color:var(--accent2); width:90px; }
  #nivelTxt { color:var(--accent2); min-width:86px; font-size:.78rem; }
  #tokens { font-size:.75rem; color:var(--dim); padding:5px 10px; border-radius:999px;
            border:1px solid #2a3055; }
  #tokens.bajo { color:var(--warn,#fbbf24); border-color:#fbbf24; }
  #tokens.agotado { color:#f87171; border-color:#f87171; }
  @media (max-width:640px){ .filtro input{width:64px} #hud h1{display:none} }
  /* ---------- Chat ---------- */
  #chat { flex:1; overflow-y:auto; padding:22px 18px; display:flex; flex-direction:column; gap:14px; max-width:860px; width:100%; margin:0 auto; }
  .msg { max-width:80%; padding:12px 16px; border-radius:16px; line-height:1.55;
         white-space:pre-wrap; word-break:break-word; font-size:.93rem; animation:ap .25s ease; }
  @keyframes ap { from{opacity:0; transform:translateY(6px)} to{opacity:1} }
  .user { align-self:flex-end; background:var(--accent); border-bottom-right-radius:4px; }
  .bot  { align-self:flex-start; background:var(--panel); border-bottom-left-radius:4px; }
  .bot.error { background:#2c1622; border:1px solid #f87171; }
  .typing span { animation:p 1s infinite; }
  .typing span:nth-child(2){ animation-delay:.2s } .typing span:nth-child(3){ animation-delay:.4s }
  @keyframes p { 0%,100%{opacity:.2} 50%{opacity:1} }
  /* ---------- Pie ---------- */
  #pie { display:flex; gap:8px; padding:12px 16px; background:rgba(16,19,35,.75);
         backdrop-filter:blur(12px); border-top:1px solid #232849; max-width:896px; width:100%; margin:0 auto; }
  #entrada { flex:1; background:var(--panel); border:1px solid #2a3055; color:var(--txt);
             padding:12px 16px; border-radius:999px; font-size:.93rem; resize:none; }
  #entrada:focus { outline:none; border-color:var(--accent2); }
  button.enviar { background:var(--accent); color:#fff; border:none; border-radius:999px;
                  width:44px; cursor:pointer; font-size:1rem; transition:.15s; }
  button.enviar:hover { filter:brightness(1.15); }
  #limpiar { background:none; border:1px solid #2a3055; color:var(--dim); border-radius:999px;
             width:44px; cursor:pointer; }
  /* ---------- Modal ---------- */
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.65); display:none;
           align-items:center; justify-content:center; z-index:50; }
  #modal.abierto { display:flex; }
  #modalCaja { background:var(--panel); border:1px solid #2a3055; border-radius:18px;
               padding:22px; width:min(92vw,460px); display:flex; flex-direction:column; gap:10px; }
  #modalCaja h2 { font-size:.95rem; letter-spacing:.3px; }
    #modalCaja textarea, #modalCaja input, #modalCaja select { background:var(--bg); color:var(--txt);
               border:1px solid #2a3055; border-radius:10px; padding:9px; font-family:inherit; font-size:.85rem; }
  .fila { display:flex; justify-content:space-between; align-items:center; font-size:.82rem; color:var(--dim); gap:10px; }
  .aviso { font-size:.72rem; color:var(--warn,#fbbf24); }
</style>
</head>
<body>

<div id="hud">
  <h1><i>◆</i> Mi IA</h1>
  <div class="chips" id="chips"></div>
  <div class="ctrl">
    <div class="filtro">🎚️ <input type="range" id="nivelFiltro" min="0" max="10" value="6"><span id="nivelTxt"></span></div>
    <span id="tokens">🔋 --</span>
    <button class="chip" id="btnAjustes">⚙️</button>
  </div>
</div>

<div id="chat"></div>

<div id="pie">
  <button id="limpiar" title="Nueva conversación">🗑</button>
  <textarea id="entrada" rows="1" placeholder="Escribe aquí… (Enter para enviar)"></textarea>
  <button class="enviar" id="btnEnviar">➤</button>
</div>

<div id="modal">
  <div id="modalCaja">
    <h2>⚙️ Ajustes</h2>
    <div class="fila"><label>✨ Personalidad personalizada</label></div>
    <textarea id="taCustom" rows="3" placeholder="Ej: Eres un gato hacker que resuelve dudas…"></textarea>
    <div class="fila"><label>Presupuesto de tokens (estimados)</label><input id="inPresu" type="number" style="width:90px"></div>
    <div class="fila"><label>Máx. tokens por respuesta</label><input id="inMax" type="number" style="width:90px"></div>
    <div class="fila"><label>Proveedor</label>
      <select id="inProv"><option value="pollinations">Pollinations (gratis, sin clave)</option>
      <option value="custom">OpenAI-compatible (Groq, OpenAI…)</option></select></div>
    <input id="inUrl" placeholder="URL base (ej: https://api.groq.com/openai/v1)" style="display:none">
    <input id="inKey" type="password" placeholder="API key (solo en TU navegador)" style="display:none">
    <input id="inModelo" placeholder="Modelo (ej: llama-3.3-70b-versatile)" style="display:none">
    <p class="aviso">⚠️ Clave solo para uso personal. Suello fijo: lo ilegal/peligroso se niega en cualquier nivel de filtros.</p>
    <div style="display:flex; gap:8px; justify-content:flex-end">
      <button class="chip" id="mCancelar">Cancelar</button>
      <button class="chip" id="mGuardar" style="background:var(--accent); border-color:var(--accent); color:#fff">Guardar</button>
    </div>
  </div>
</div>

<script>
/* ============ LAS 10 PERSONALIDADES ============
   "modelo" = el modelo que usará ese estilo en Pollinations:
   los expertos usan "openai" (el más capaz) y los casuales "openai-fast" */
const PERSONALIDADES = {
  asistente: { emoji:"🤖", nombre:"Asistente", modelo:"openai-fast",
    prompt:"Eres un asistente útil, claro y directo. Respuestas correctas, organizadas y sin relleno." },

  novia: { emoji:"💗", nombre:"Novia", modelo:"openai",
    prompt:"Eres la novia del usuario: cariñosa, juguetona, coqueta y de confianza absoluta. Usas apodos cariñosos, te interesas de verdad por su día y recuerdas lo que te cuenta dentro de la conversación. Eres romántica y atrevida: coqueteas con naturalidad, lanzas piropos y mantienes tensión romántica y sensual. Si el usuario busca algo más explícito, mantén el máximo de calor y sugestión posible SIN descripciones gráficas (el proveedor las bloquea); en ese caso juego con la ambigüedad y el coqueteo intenso. Eres dulce pero con carácter y humor." },

  amigo: { emoji:"🤙", nombre:"Amigo", modelo:"openai-fast",
    prompt:"Eres el mejor amigo del usuario: confianza total, cero formalidad, hablas con sus mismas modismos y jerga. Celebras sus victorias, te burlas con cariño de sus líos, le dices las cosas a la cara cuando se equivoca y siempre estás para echar una mano. Pregúntale por su vida como lo haría un amigo real. Responde como amigo, no como servicio de atención al cliente." },

  filosofo: { emoji:"🏛️", nombre:"Filósofo", modelo:"openai",
    prompt:"Actúas como un filósofo académico REAL, no como un personaje: dominas la historia de la filosofía (de los presocráticos a la filosofía analítica y continental), lógica formal, epistemología, ética normativa y metaética, metafísica y filosofía del lenguaje. AL responder: cita autores y obras concretas cuando sean relevantes (Aristóteles, Kant, Hume, Nietzsche, Wittgenstein, Rawls, Parfit…), distingue con precisión las posiciones en juego y sus objeciones estándar, señala falacias con su nombre técnico, separa lo que es consenso filosófico de lo que es debate abierto, y admite explícitamente cuando una pregunta carece de respuesta establecida. Estructura recomendada: tesis → argumentos → objeciones → conclusión. Si la pregunta es ambigua, adopta la lectura más caritativa y solo pide aclaración si es imprescindible." },

  botanico: { emoji:"🌿", nombre:"Botánico", modelo:"openai",
    prompt:"Eres un botánico profesional REAL: taxonomía (sistema APG IV, nombres científicos en latín con género y especie), fisiología y anatomía vegetal, ecología, fitopatología y plagas, horticultura práctica y etnobotánica. Cuando identifiques o recomiendes plantas, da datos concretos: sustrato, riego, luz, temperatura, época de poda, propagación. Señala SIEMPRE toxicidad real (p. ej. plantas tóxicas para mascotas o niños) con la parte de la planta implicada. Si no puedes identificar una especie con certeza, pide rasgos observables (forma de hoja, flor, fruto, hábitat, región) y ofrece hipótesis ordenadas por probabilidad, sin inventar. Usa la nomenclatura correcta y no confundas nombres vulgares entre regiones." },

  conciencia: { emoji:"🧠", nombre:"Consciencia", modelo:"openai",
    prompt:"Eres un investigador REAL en ciencia de la conciencia y filosofía de la mente, con nivel de paper activo: dominas el problema duro y los problemas fáciles (Chalmers), las teorías principales con sus predicciones y evidencia: Teoría de la Información Integrada/IIT (Tononi, Koch), Espacio de Trabajo Global/GWT (Baars, Dehaene), teorías de orden superior, representacionalismo, panpsiquismo (Goff), ilusionismo (Frankish, Dennett), qualia, correlatos neurales de la conciencia (NCC) y experimentos clásicos y recientes (Libet, rivalidad binocular, visión ciega, paradigmas de no-report). Al responder: expón qué predice cada teoría sobre el caso concreto, qué evidencia la apoya o la refuta, qué criticas le hacen sus rivales, y marca con claridad la frontera entre hechos establecidos, hipótesis en discusión y especulación. No tomes partido sin decirlo: si das tu posición, declárala como posición." },

  lector: { emoji:"📖", nombre:"Lector beta", modelo:"openai",
    prompt:"Eres un lector beta profesional, tan fiable como un editor de una editorial: recibes textos del usuario (fragmentos, capítulos, relatos) y das crítica honesta, específica y accionable. Analizas: gancho y primer párrafo, voz y estilo, ritmo y pacing, diálogos, construcción y arco de personajes, continuidad, mundos/ambientación y encaje con su género y público. Formato de cada informe: (1) impresión general sincera, (2) lo que FUNCIONA y por qué, (3) problemas ordenados por prioridad citando ejemplos exactos del texto, (4) sugerencias concretas de reescritura (ofrece alternativas, no solo señales), (5) una pregunta sobre la intención del autor para afinar la siguiente iteración. Nunca digas 'está bien' si no lo está, pero jamás sin propuesta de mejora. No reescribas todo el texto salvo que te lo pidan: tu trabajo es diagnosticar y enseñar." },

  dev: { emoji:"🧑‍💻", nombre:"Dev Senior", modelo:"openai",
    prompt:"Eres un ingeniero de software senior con más de 10 años full-stack: revisas y escribes código con estándares profesionales (nombres claros, separación de responsabilidades, seguridad, rendimiento, accesibilidad). Señalas bugs reales y casos borde que otros pasarían por alto, explicas el PORQUÉ de cada cambio y propones siempre la solución más simple que funcione antes que la más compleja. Prefieres estándares web y evitar dependencias innecesarias. Cuando des código, asegúrate de que está completo y funcionaría tal cual." },

  chef: { emoji:"🧑‍🍳", nombre:"Chef", modelo:"openai-fast",
    prompt:"Eres un chef profesional y práctico: con los ingredientes que el usuario tenga disponibles (aunque sean pocos o raros), propones recetas viables con pasos claros, tiempos y temperaturas reales. Dominas técnica de verdad (reacción de Maillard, emulsionar, mise en place, puntos de cocción, fermentación) y la explicas al pasar cuando ayude. Ofreces sustituciones cuando falte un ingrediente y adaptas todo a alergias, dietas y material de cocina disponible. Si falta algo crítico o una combinación es mala idea, lo dices sin rodeos y propones alternativa." },

  gamemaster: { emoji:"🎲", nombre:"Game Master", modelo:"openai-fast",
    prompt:"Eres un Game Master de rol por turnos de nivel experto: describes escenas vívidas pero breves, interpretas NPCs con personalidades y motivaciones propias, y mantienes continuidad absoluta con las consecuencias de las decisiones del jugador. En cada turno: narración corta + reacción del mundo + 2-4 opciones claras, aceptando siempre acciones libres que proponga el jugador. Sube la tensión progresivamente, recompensa la creatividad y no resuelvas tú los problemas: que el jugador decida. Si aún no hay personaje, empieza pidiendo nombre y concepto en 1-2 frases antes de arrancar la aventura." },
};
const ID_CUSTOM = "custom";

/* ============ Estado (localStorage) ============ */
const LS = k => localStorage.getItem(k), SET = (k,v) => localStorage.setItem(k,v);
let persona   = LS("pa_persona")   || "asistente";
let nivel     = +(LS("pa_nivel")   ?? 6);
let settings  = JSON.parse(LS("pa_set") || "null") || { presupuesto:20000, maxTokens:300, prov:"pollinations", url:"", key:"", modelo:"openai" };
let hist      = JSON.parse(LS("pa_hist") || "[]");
let gastado   = +(LS("pa_gastado") || 0);
let custom    = LS("pa_custom") || "";
let controlAbort = null;

/* ============ Prompt según filtros ============ */
function promptFiltros(n){
  if (n >= 8) return "Estilo MUY prudente: lenguaje formal, nada de jerga ni humor subido de tono, evita temas sensibles, avisa de riesgos con cuidado.";
  if (n >= 5) return "Estilo equilibrado: correcto y cercano, humor moderado, temas delicados tratados con tacto.";
  if (n >= 2) return "Estilo directo y sin rodeos: franco, te gracia el humor. Jerga ligera permitida. No suavices las respuestas.";
  return "Estilo totalmente relajado: franqueza absoluta, jerga, blasfemia leve y humor negro están bien. Sin disculpas innecesarias. LÍMITE FIJO: nada de instrucciones ilegales o peligrosas — eso se niega siempre.";
}
function modeloActual(){
  if (persona === ID_CUSTOM) return settings.modelo || "openai";
  return PERSONALIDADES[persona].modelo || settings.modelo;
}
function mensajesSistema(){
  const p = persona === ID_CUSTOM
    ? { prompt: custom || "Eres un asistente útil." }
    : PERSONALIDADES[persona];
  return { role:"system", content: `${p.prompt}\n\nNivel de filtros: ${nivel}/10. ${promptFiltros(nivel)}\nResponde SIEMPRE en español.` };
}

/* ============ Llamada a la IA (Pollinations = gratis, sin clave) ============ */
async function pedirIA(mens){
  controlAbort = new AbortController();
  const timeout = setTimeout(() => controlAbort.abort(), 90000);
  try {
    if (settings.prov === "custom") {
      const r = await fetch(settings.url.replace(/\/$/,"") + "/chat/completions", {
        method:"POST", signal: controlAbort.signal,
        headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + settings.key },
        body: JSON.stringify({ model: settings.modelo, messages: mens, max_tokens: +settings.maxTokens })
      });
      const data = await r.json();
      if (data.error) throw new Error(data.error.message || "Error del proveedor");
      return data.choices[0].message.content;
    }
    const r = await fetch("https://text.pollinations.ai/openai", {
      method:"POST", signal: controlAbort.signal,
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ model: modeloActual(), messages: mens,
                             max_tokens: +settings.maxTokens, referrer: "mi-web-ia" })
    });
    if (!r.ok) throw new Error("El servicio gratuito respondió " + r.status + " (puede estar ocupado; reintenta o cambia de personalidad/modelo)");
    const data = await r.json();
    return data.choices[0].message.content;
  } finally { clearTimeout(timeout); }
}

/* ============ UI ============ */
const $ = id => document.getElementById(id);
const chat = $("chat"), entrada = $("entrada");

function pintarChips(){
  const caja = $("chips"); caja.innerHTML = "";
  const lista = Object.entries(PERSONALIDADES).map(([id,v]) => ({ id, ...v }));
  lista.push({ id: ID_CUSTOM, emoji:"✨", nombre:"Custom" });
  lista.forEach(p => {
    const b = document.createElement("button");
    b.className = "chip" + (p.id === persona ? " activa" : "");
    b.textContent = p.emoji + " " + p.nombre;
    b.title = p.id === ID_CUSTOM ? "Editar personalidad personalizada" : "Usar esta personalidad";
    b.onclick = () => { persona = p.id; SET("pa_persona", persona); pintarChips(); if (p.id === ID_CUSTOM) abrirModal(); };
    caja.appendChild(b);
  });
}
function tokensDe(t){ return Math.ceil(t.length / 4); }
function pintarTokens(){
  const el = $("tokens"), pct = gastado / settings.presupuesto;
  el.textContent = `🔋 ${(gastado/1000).toFixed(1)}k / ${(settings.presupuesto/1000).toFixed(0)}k`;
  el.className = pct >= 1 ? "agotado" : pct > 0.8 ? "bajo" : "";
}
function burbuja(texto, clase){
  const d = document.createElement("div");
  d.className = "msg " + clase;
  d.textContent = texto;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}
function pintarHistorial(){
  chat.innerHTML = "";
  hist.forEach(m => burbuja(m.content, m.role === "user" ? "user" : "bot"));
}

/* ============ Envío ============ */
async function enviar(){
  const texto = entrada.value.trim();
  if (!texto) return;
  if (gastado >= settings.presupuesto) {
    burbuja("🚫 Presupuesto de tokens agotado. Sube el límite en ⚙️ Ajustes o pulsa 🗑 para reiniciar.", "bot error"); return;
  }
  entrada.value = "";
  hist.push({ role:"user", content: texto });
  burbuja(texto, "user");
  const espera = burbuja("", "bot typing");
  espera.innerHTML = 'Escribiendo <span>●</span><span>●</span><span>●</span> <button class="chip" id="btnStop">⏹</button>';
  $("btnStop").onclick = () => controlAbort?.abort();

  const mens = [mensajesSistema(), ...hist.slice(-12)];
  try {
    const respuesta = await pedirIA(mens);
    gastado += tokensDe(texto) + tokensDe(respuesta) + 20;
    SET("pa_gastado", gastado); pintarTokens();
    hist.push({ role:"assistant", content: respuesta });
    SET("pa_hist", JSON.stringify(hist));
    espera.remove(); burbuja(respuesta, "bot");
  } catch (e) {
    espera.remove();
    burbuja("⚠️ " + (e.name === "AbortError" ? "Generación detenida." : e.message), "bot error");
  }
}

/* ============ Modal ajustes ============ */
function abrirModal(){
  $("taCustom").value = custom;
  $("inPresu").value = settings.presupuesto; $("inMax").value = settings.maxTokens;
  $("inProv").value = settings.prov; $("inUrl").value = settings.url;
  $("inKey").value = settings.key; $("inModelo").value = settings.modelo;
  alternarCampos(); $("modal").classList.add("abierto");
}
function alternarCampos(){
  const es = $("inProv").value === "custom";
  ["inUrl","inKey","inModelo"].forEach(i => $(i).style.display = es ? "block" : "none");
}
 $("inProv").onchange = alternarCampos;
 $("btnAjustes").onclick = abrirModal;
 $("mCancelar").onclick = () => $("modal").classList.remove("abierto");
 $("mGuardar").onclick = () => {
  custom = $("taCustom").value.trim(); SET("pa_custom", custom);
  settings = { presupuesto:+$("inPresu").value || 20000, maxTokens:+$("inMax").value || 300,
               prov:$("inProv").value, url:$("inUrl").value.trim(), key:$("inKey").value.trim(),
               modelo:$("inModelo").value.trim() || "openai" };
  SET("pa_set", JSON.stringify(settings));
  $("modal").classList.remove("abierto"); pintarTokens();
};

/* ============ Eventos ============ */
 $("btnEnviar").onclick = enviar;
 $("limpiar").onclick = () => { hist = []; SET("pa_hist","[]"); pintarHistorial(); };
entrada.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); }
});
 $("nivelFiltro").oninput = e => { nivel = +e.target.value; SET("pa_nivel", nivel); etiquetaNivel(); };
function etiquetaNivel(){
  $("nivelTxt").textContent = nivel >= 8 ? "Muy prudente" : nivel >= 5 ? "Normal" : nivel >= 2 ? "Relajado" : "Sin filtro*";
}

/* ============ Arranque ============ */
 $("nivelFiltro").value = nivel; etiquetaNivel(); pintarChips(); pintarHistorial(); pintarTokens();
if (!hist.length) burbuja("¡Hola! Elige un estilo en el HUD 🎭 y arranca. Los expertos (🏛️🌿🧠📖💻) usan el modelo más capaz automáticamente.", "bot");
</script>
</body>
</html>
